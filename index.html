<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object detection - MediaPipe</title>
  <style>
    body {
      font-family: roboto, system-ui, sans-serif;
      margin: 0;
      color: #3d3d3d;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
      -moz-transform: rotateY(180deg);
    }
    section { opacity: 1; transition: opacity 500ms ease-in-out; }
    .invisible { opacity: 0.2; }
    .videoView {
      position: relative;
      width: 100%;
    }
    .videoView.live-fullscreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .video-stage {
      position: relative;
      flex-shrink: 0;
    }
    .highlighter {
      background: none;
      border: 5px solid #cd32b8;
      border-radius: 50%;
      z-index: 1;
      position: absolute;
      box-sizing: border-box;
    }
    .session-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10001;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: rgba(0, 0, 0, 0.55);
      box-sizing: border-box;
    }
    .session-bar__left,
    .session-bar__right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .session-bar__right {
      justify-content: flex-end;
    }
    .session-bar__center {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 1 auto;
    }
    .session-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .session-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .session-btn:not(:disabled):active {
      background: rgba(255, 255, 255, 0.28);
    }
    .session-rec {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
    }
    .session-rec.hidden {
      display: none;
    }
    .session-rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .session-rec--running .session-rec-dot {
      animation: rec-pulse 1.2s ease-in-out infinite;
    }
    .session-rec--paused .session-rec-dot {
      background: #9ca3af;
      animation: none;
    }
    .session-rec--paused {
      color: rgba(255, 255, 255, 0.55);
    }
    @keyframes rec-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .session-count {
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      font-variant-numeric: tabular-nums;
      min-width: 2ch;
      text-align: center;
    }
    .session-count--paused {
      opacity: 0.55;
    }
    .session-hint {
      position: fixed;
      top: calc(64px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10001;
      padding: 6px 14px;
      font-size: 13px;
      color: #fff;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 6px;
      pointer-events: none;
      white-space: nowrap;
    }
    .session-hint.hidden {
      display: none;
    }
    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 10002;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .settings-overlay.hidden {
      display: none;
    }
    .settings-sheet {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 20px 20px max(20px, env(safe-area-inset-bottom));
      box-sizing: border-box;
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .settings-header h2 {
      margin: 0;
      font-size: 1.25rem;
    }
    .settings-close {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      color: #666;
    }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      font-size: 1rem;
      cursor: pointer;
      user-select: none;
    }
    .settings-done {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #007f8b;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .timing-stats {
      display: none;
    }
    .live-fullscreen .timing-stats {
      display: inline-flex;
      position: fixed;
      bottom: 0;
      left: 0;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 10px;
      border-radius: 4px 4px 0 0;
      z-index: 3;
    }
    .snake-frame {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(2.5rem + 5px);
      width: 100%;
      height: 20vh;
      pointer-events: none;
      z-index: 2;
    }
    .snake-dot {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #2563eb;
      box-sizing: border-box;
      pointer-events: none;
    }
    .snake-dot-calculated {
      background: #f80320;
    }
    .snake-dot-juggle {
      width: 10px;
      height: 10px;
      background: #2feb25;
    }
    .snake-dot-label {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      line-height: 1.2;
      white-space: nowrap;
      background: #ffffffb3;
      padding: 2px 4px;
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      pointer-events: none;
    }
    .snake-dot-label-top {
      bottom: 100%;
      margin-bottom: 4px;
    }
    .snake-dot-label-bottom {
      top: 100%;
      margin-top: 4px;
    }
  </style>
</head>
<body class="live-active">
  <div id="sessionBar" class="session-bar">
    <div class="session-bar__left">
      <button type="button" id="sessionPrimaryBtn" class="session-btn" title="Start" aria-label="Start">▶</button>
      <div id="sessionRec" class="session-rec hidden" aria-hidden="true">
        <span class="session-rec-dot"></span>
        <span id="sessionTimer">0:00</span>
      </div>
    </div>
    <div class="session-bar__center">
      <div id="sessionCount" class="session-count" aria-live="polite">0</div>
    </div>
    <div class="session-bar__right">
      <button type="button" id="sessionStopBtn" class="session-btn" title="Stop" aria-label="Stop" disabled>⏹</button>
      <button type="button" id="sessionMenuBtn" class="session-btn" title="Menu" aria-label="Menu">⋮</button>
    </div>
  </div>
  <div id="sessionHint" class="session-hint hidden" aria-live="polite"></div>
  <div id="settingsOverlay" class="settings-overlay hidden" aria-hidden="true">
    <div class="settings-sheet" role="dialog" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <h2 id="settingsTitle">Settings</h2>
        <button type="button" id="settingsCloseBtn" class="settings-close" aria-label="Close">✕</button>
      </div>
      <label class="settings-row">
        <input type="checkbox" id="voiceCountCheckbox" />
        Voice count
      </label>
      <button type="button" id="settingsDoneBtn" class="settings-done">Done</button>
    </div>
  </div>
  <section id="demos" class="invisible">
    <div id="liveView" class="videoView live-fullscreen">
      <div id="videoStage" class="video-stage">
        <video id="webcam" autoplay playsinline></video>
        <div id="timingStats" class="timing-stats" aria-live="polite">
          <span id="aiMs">AI: — ms</span>
          <span id="postAiMs">PostAI: — ms</span>
          <span id="totalMsFps">Total: — ms / — FPS</span>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
